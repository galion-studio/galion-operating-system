<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Plymouth</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#d6e2e8;overflow:hidden}
  img.film{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .core{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);text-align:center}
  .core img{display:block;margin:0 auto}
  .bar{width:192px;height:2px;margin:28px auto 0;background:rgba(214,226,232,.18);position:relative}
  .fill{position:absolute;left:0;top:0;height:2px;background:#d6e2e8}
  #label{font:12px/1.4 ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;margin-top:16px}
</style></head>
<body>
<img id="film" class="film" alt="">
<div id="core" class="core" hidden>
  <img id="mark" alt="" src="images/mark-ring.png">
  <img id="dot" alt="" src="images/dot-00.png" style="position:absolute;left:50%;top:0;transform:translateX(-50%)">
  <div class="bar"><div id="fill" class="fill"></div></div>
  <div id="label"></div>
</div>
<script>
const params = new URLSearchParams(location.search);
const mode = params.get("mode") || "boot";
const film = document.getElementById("film");
const core = document.getElementById("core");
const dot = document.getElementById("dot");
const fill = document.getElementById("fill");
const label = document.getElementById("label");
label.textContent = mode;
function cin(i){return "images/cin-" + String(i).padStart(3,"0") + ".png";}
function dotName(i){return "images/dot-" + String(i).padStart(2,"0") + ".png";}
let frame = 0;
if (mode === "boot") {
  const timer = setInterval(() => {
    if (frame >= 100) {
      clearInterval(timer);
      film.hidden = true;
      core.hidden = false;
      breathe();
      return;
    }
    film.src = cin(frame);
    frame += 1;
  }, 20);
} else {
  film.hidden = true;
  core.hidden = false;
  breathe();
}
function breathe(){
  const start = performance.now();
  function tick(now){
    const t = (now - start) / 1000;
    const amount = mode === "boot" ? Math.min(1, t / 3.2) : (1 - Math.min(1, t / 3.2));
    fill.style.width = Math.floor(Math.abs(amount) * 192) + "px";
    const step = ((Math.floor(t * 7.5) % 24) + 24) % 24;
    dot.src = dotName(step);
    if (t < 4.2) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
</script></body></html>
