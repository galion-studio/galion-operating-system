# Managed by packaging/wsl/provision-galion-ubuntu.sh.
# systemd becomes PID 1 after this distro is restarted from Windows.
# appendWindowsPath keeps Windows copies of node, npm, cargo, and python
# off PATH, so their caches stay on this distro's Linux filesystem.

[boot]
systemd=true

[user]
default=galion

[interop]
enabled=true
appendWindowsPath=false
