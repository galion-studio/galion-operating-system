[package]
name = "galion-init"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "In-memory prototype of galion-init. Does not replace the host init."

# Seed binaries. Static musl, opt-level 3, fat LTO, one codegen unit, symbols stripped.
# The voice archive note's opt-level "z" is a different package and is not built here.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Public names follow the module (ToneHook, desktop_handoff).
module_name_repetitions = "allow"
# Callers already use the returned plan. Annotating every getter does not change the boot.
must_use_candidate = "allow"
# Display on the error is the message a boot prints.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Prose names such as PID and HTML are not code identifiers.
doc_markdown = "allow"
# A panic on a runtime path is a failed boot. Tests may still unwrap.
unwrap_used = "deny"
expect_used = "deny"
