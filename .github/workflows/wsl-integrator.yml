# Shellcheck, bash, and Pester for the Galion-Ubuntu owner entry.
# This job does not enable WSL, download the Ubuntu rootfs, or write a
# virtual disk. A green run is not a GALION-STUDIO result and not a WSL result.

name: WSL integrator dry run

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  integrator:
    name: Shellcheck, bash, and Pester
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck and PowerShell
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          if ! command -v pwsh >/dev/null 2>&1; then
            curl -fsSL -o /tmp/powershell.deb https://github.com/PowerShell/PowerShell/releases/download/v7.7.0/powershell_7.7.0-1.deb_amd64.deb
            sudo apt-get install -y /tmp/powershell.deb
          fi

      - name: Install Pester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force

      - name: Shellcheck the WSL steps
        run: |
          set -euo pipefail
          echo 'Shellcheck on the runner. This is not a GALION-STUDIO or WSL result.'
          shellcheck --severity=warning packaging/windows/wsl-on-g/steps/*.sh

      - name: Bash step tests
        run: |
          set -euo pipefail
          echo 'Dry-run step tests. No git fetch, no cargo, no rootfs download.'
          bash packaging/windows/wsl-on-g/steps/test-steps.sh

      - name: Pester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester
          $config = New-PesterConfiguration
          $config.Run.Path = 'packaging/windows/wsl-on-g/tests/GalionUbuntuOnG.Tests.ps1'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

      - name: Re-read the published rootfs checksum
        run: |
          set -euo pipefail
          echo 'Reading SHA256SUMS only. The rootfs file is not downloaded.'
          curl -fsSL -o /tmp/SHA256SUMS https://releases.ubuntu.com/24.04/SHA256SUMS
          grep -F 'bb415d824822c4b878125729af451a5d18fb13d1cf5cbed9a7393ad64ac6039e  ubuntu-24.04.5-wsl-amd64.wsl' /tmp/SHA256SUMS
          grep -F 'GALION_UBUNTU_WSL_SHA256=bb415d824822c4b878125729af451a5d18fb13d1cf5cbed9a7393ad64ac6039e' packaging/windows/wsl-on-g/pins.env

      - name: Label the result
        if: always()
        run: |
          {
            echo '## WSL integrator dry run'
            echo
            echo 'Not a GALION-STUDIO result and not a WSL hardware result. The job did not enable WSL, did not download the Ubuntu rootfs, and did not write a virtual disk. Shellcheck, the bash dry-run, and Pester ran on the hosted runner. SHA256SUMS was read from releases.ubuntu.com.'
          } >> "$GITHUB_STEP_SUMMARY"
