name: Pi 5 seed

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pi-seed:
    name: pi-seed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl,x86_64-unknown-linux-musl

      - name: qemu-user
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static

      - name: Build static musl binaries
        run: |
          set -euo pipefail
          sysroot="$(rustc --print sysroot)"
          host="$(rustc -vV | sed -n 's/^host: //p')"
          export PATH="$sysroot/lib/rustlib/$host/bin:$PATH"
          command -v rust-lld
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=rust-lld
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=rust-lld
          cargo build --manifest-path galion-init/Cargo.toml --locked --release --target aarch64-unknown-linux-musl
          cargo build --manifest-path galion-init/Cargo.toml --locked --release --target x86_64-unknown-linux-musl
          aarch64=galion-init/target/aarch64-unknown-linux-musl/release/galion-init
          amd64=galion-init/target/x86_64-unknown-linux-musl/release/galion-init
          file_aarch64=$(file "$aarch64")
          file_amd64=$(file "$amd64")
          printf '%s\n' "$file_aarch64" | grep -q 'ARM aarch64'
          printf '%s\n' "$file_amd64" | grep -q 'x86-64'
          printf '%s\n' "$file_aarch64" | grep -Eq 'statically linked|static-pie linked'
          printf '%s\n' "$file_amd64" | grep -Eq 'statically linked|static-pie linked'
          printf '%s\n' "$file_aarch64" | grep -q 'stripped'
          printf '%s\n' "$file_amd64" | grep -q 'stripped'
          ldd_aarch64=$(ldd "$aarch64" 2>&1 || true)
          ldd_amd64=$(ldd "$amd64" 2>&1 || true)
          printf '%s\n' "$ldd_aarch64" | grep -Eq 'statically linked|not a dynamic executable'
          printf '%s\n' "$ldd_amd64" | grep -Eq 'statically linked|not a dynamic executable'
          {
            echo "### Binary sizes"
            stat -c '%s %n' "$aarch64" "$amd64"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-run aarch64 under qemu-user
        run: |
          set -euo pipefail
          if command -v qemu-aarch64-static >/dev/null; then
            qemu=qemu-aarch64-static
          else
            qemu=qemu-aarch64
          fi
          bin=galion-init/target/aarch64-unknown-linux-musl/release/galion-init
          out="$("$qemu" "$bin" desktop)"
          printf '%s\n' "$out" | grep -q 'profile desktop'
          printf '%s\n' "$out" | grep -q 'runtime in-memory'
          set +e
          "$qemu" "$bin" --execute >/tmp/galion-execute.out 2>/tmp/galion-execute.err
          code=$?
          set -e
          test "$code" -eq 2
          test ! -s /tmp/galion-execute.out
          amd64=galion-init/target/x86_64-unknown-linux-musl/release/galion-init
          out_amd64=$("$amd64" desktop)
          printf '%s\n' "$out_amd64" | grep -q 'profile desktop'

      - name: Package seed and install it twice
        run: sh packaging/test-pi-seed.sh

      - name: Upload seed
        uses: actions/upload-artifact@v4
        with:
          name: galion-os-pi5-seed-${{ github.sha }}.tar.gz
          path: dist/galion-os-pi5-seed-${{ github.sha }}.tar.gz
          if-no-files-found: error
