name: Rust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy
        run: cargo clippy --manifest-path galion-init/Cargo.toml --locked --all-targets -- -D warnings
