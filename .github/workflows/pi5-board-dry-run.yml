# Shellcheck the Pi 5 scripts and write the board report from stubbed
# files. This job does not boot a Pi, start QEMU, flash an SSD, or read
# a board. A green run is not a Raspberry Pi 5 result.

name: Pi 5 offline dry run

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  board-dry-run:
    name: Shellcheck and stubbed report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shellcheck Pi 5 scripts
        run: |
          set -eu
          echo "Shellcheck on the runner. This is not a Raspberry Pi 5 result."
          sh scripts/pi5/lint.sh

      - name: Offline board report
        run: |
          set -eu
          echo "Stubbed hardware reads. This is not a Raspberry Pi 5 result."
          sh scripts/pi5/test-board-report.sh

      - name: Offline first boot
        run: |
          set -eu
          echo "Stubbed hardware and systemd. This is not a Raspberry Pi 5 result."
          sh scripts/pi5/test-first-boot.sh

      - name: Offline report pack
        run: |
          set -eu
          echo "Fixture reports only. This is not a Raspberry Pi 5 result."
          sh scripts/pi5/test-pack-reports.sh

      - name: Label the result
        if: always()
        run: |
          {
            echo '## Pi 5 offline dry run'
            echo
            echo 'Not a Raspberry Pi 5 result. No Pi 5, no Raspberry Pi OS image, no SSD, and no QEMU guest were used. Shellcheck ran on the runner. The board report, the first-boot report, and the packed tarball were written from stubbed files.'
          } >> "$GITHUB_STEP_SUMMARY"
