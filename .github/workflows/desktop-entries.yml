name: Desktop entries

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  desktop-entries:
    name: desktop-file-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install desktop-file-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils shellcheck

      - name: Validate desktop entries
        run: sh desktop/validate.sh

      - name: Shellcheck the install script
        run: shellcheck --severity=warning -s sh desktop/install.sh desktop/test-install.sh desktop/boot/test-boot.sh desktop/boot/sounds/galion-boot-sound desktop/boot/plymouth/install.sh desktop/boot/plymouth/uninstall.sh

      - name: Install into a temporary XDG home
        run: sh desktop/test-install.sh

      - name: Check the boot theme and tones
        run: sh desktop/boot/test-boot.sh
