# Opt-in Galion session defaults. desktop/install.sh copies this file.
# Colour follows the system: gtk-application-prefer-dark-theme is unset,
# and gtk.css switches with prefers-color-scheme.
# gtk-enable-animations is unset so a reduced-motion setting stays in charge.
# The family and the 16px body size are site/assets/tokens.css.
# The bundled faces are WOFF2 web subsets, so they are not installed here.

[Settings]
gtk-font-name=IBM Plex Sans 16px
